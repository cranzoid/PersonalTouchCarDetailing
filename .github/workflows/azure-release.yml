name: Azure release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage a new build, or swap an already verified staging build
        required: true
        type: choice
        options:
          - stage
          - swap

permissions:
  contents: read
  id-token: write

concurrency:
  group: ptcd-azure-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-ptcd-prod
  AZURE_WEBAPP_NAME: app-ptcd-prod-7mutra
  AZURE_SLOT_NAME: staging
  STAGING_URL: https://app-ptcd-prod-7mutra-staging.azurewebsites.net
  PRODUCTION_URL: https://www.personaltouchcardetailing.ca
  PUBLIC_SITE_URL: https://www.personaltouchcardetailing.ca

jobs:
  stage:
    if: github.event.inputs.operation == 'stage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ptcd
          POSTGRES_PASSWORD: ptcd
          POSTGRES_DB: ptcd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptcd -d ptcd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ptcd:ptcd@127.0.0.1:5432/ptcd_test
      NEXT_TELEMETRY_DISABLED: "1"
      SEO_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: TEST=1 npm run db:migrate
      - run: npm test
      - run: ./node_modules/.bin/tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Package the standalone Linux release
        run: |
          mkdir release
          cp -R .next/standalone/. release/
          mkdir -p release/.next
          cp -R .next/static release/.next/static
          cp -R public drizzle release/
          cp startup.sh release/
          test -f release/server.js
      - name: Smoke-test the standalone artifact
        run: |
          (
            cd release
            NODE_ENV=production \
            DATABASE_URL="$TEST_DATABASE_URL" \
            SESSION_SECRET=standalone-release-smoke-test-secret \
            SEED_ADMIN_EMAIL=release-smoke@example.invalid \
            SEED_ADMIN_PASSWORD=standalone-release-smoke-password \
            APP_BASE_URL=https://release-smoke.example.invalid \
            PUBLIC_SITE_URL="$PUBLIC_SITE_URL" \
            SEO_INDEXABLE=false \
            HOSTNAME=127.0.0.1 \
            PORT=3001 \
            node server.js > standalone.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid"' EXIT
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                --output /dev/null http://127.0.0.1:3001/api/health; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                cat standalone.log
                exit 1
              fi
              sleep 1
            done
            curl --fail --silent --show-error --max-time 10 \
              --output /dev/null http://127.0.0.1:3001/
            curl --fail --silent --show-error --max-time 10 \
              --output /dev/null http://127.0.0.1:3001/connect
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:3001/ > /tmp/release-seo-home.html
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:3001/robots.txt > /tmp/release-seo-robots.txt
            curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:3001/sitemap.xml > /tmp/release-seo-sitemap.xml
            grep -Fq "$PUBLIC_SITE_URL/" /tmp/release-seo-home.html
            grep -Fq 'Disallow: /' /tmp/release-seo-robots.txt
            grep -Fq "$PUBLIC_SITE_URL/" /tmp/release-seo-sitemap.xml
            if grep -Eiq 'localhost|azurewebsites\.net' /tmp/release-seo-home.html /tmp/release-seo-robots.txt /tmp/release-seo-sitemap.xml; then
              echo 'Forbidden development or Azure hostname found in rendered SEO output.'
              exit 1
            fi
          )
      - name: Create release archive
        run: |
          (cd release && zip -qr ../ptcd-app.zip .)
          sha256sum ptcd-app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ptcd-app-${{ github.sha }}
          path: ptcd-app.zip
          if-no-files-found: error
          retention-days: 14
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Staging shares the production database and applies migrations at boot,
      # so capture the restore target BEFORE the deploy. Burstable servers
      # cannot take customer on-demand backups, so point-in-time restore is the
      # recovery path: `az postgres flexible-server restore --restore-time`
      # accepts exactly this timestamp.
      - name: Record database restore point
        run: |
          RESTORE_POINT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Pre-deploy restore point (UTC): $RESTORE_POINT"
          {
            echo "### Database restore point"
            echo
            echo "If this release damages data, restore to the moment before it:"
            echo
            echo '```'
            echo "az postgres flexible-server restore \\"
            echo "  --resource-group $AZURE_RESOURCE_GROUP \\"
            echo "  --name psql-ptcd-restored \\"
            echo "  --source-server psql-ptcd-prod-7mutra \\"
            echo "  --restore-time $RESTORE_POINT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy only to staging
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_SLOT_NAME" \
            --src-path ptcd-app.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false
      - name: Warm and verify staging
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 \
              --output /dev/null "$STAGING_URL/api/health"; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              exit 1
            fi
            sleep 5
          done
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$STAGING_URL/"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$STAGING_URL/connect"

  swap:
    if: github.event.inputs.operation == 'swap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Recheck staging
        run: |
          curl --fail --silent --show-error --max-time 10 --output /dev/null "$STAGING_URL/api/health"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$STAGING_URL/"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$STAGING_URL/connect"
      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_SLOT_NAME" \
            --target-slot production
      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-all-errors --max-time 15 --output /dev/null "$PRODUCTION_URL/api/health"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$PRODUCTION_URL/"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$PRODUCTION_URL/connect"
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/" > /tmp/production-seo-home.html
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/robots.txt" > /tmp/production-seo-robots.txt
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/sitemap.xml" > /tmp/production-seo-sitemap.xml
          grep -Fq 'Sitemap: https://www.personaltouchcardetailing.ca/sitemap.xml' /tmp/production-seo-robots.txt
          grep -Fq 'https://www.personaltouchcardetailing.ca/' /tmp/production-seo-sitemap.xml
          if grep -Eiq 'localhost|azurewebsites\.net' /tmp/production-seo-home.html /tmp/production-seo-robots.txt /tmp/production-seo-sitemap.xml; then
            echo 'Forbidden development or Azure hostname found in production SEO output.'
            exit 1
          fi
